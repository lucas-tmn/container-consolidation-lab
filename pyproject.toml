[project]
name = "ccl"
version = "0.1.0"
description = "Container consolidation lab: measurable ocean-container planning engine"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
edw = ["pyodbc>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
